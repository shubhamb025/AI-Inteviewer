<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#121212; color:#e0e0e0; font-family:'Poppins',sans-serif; }
    .container {
      max-width:700px; margin-top:50px; background:#1e1e1e;
      border-radius:12px; padding:30px; box-shadow:0px 4px 15px rgba(0,0,0,0.5);
    }
    h1 { text-align:center; margin-bottom:20px; }
    .card { background:#2c2c2c; padding:20px; border-radius:8px; margin-bottom:15px;color:#fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Evaluation Results</h1>
    <div class="card">Technical Score: {{ result.technical_score }}</div>
    <div class="card">Problem Solving: {{ result.problem_solving_score }}</div>
    <div class="card">Communication: {{ result.communication_score }}</div>
    <div class="card">Summary: {{ result.summary }}</div>
    <div class="card">Recommendation: <strong>{{ result.recommendation }}</strong></div>
    <a href="/" class="btn btn-primary w-100 mt-3">Start Again</a>
  </div>
</body>
</html>
