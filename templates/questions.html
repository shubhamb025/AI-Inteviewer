<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview Questions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#121212; color:#e0e0e0; font-family:'Poppins',sans-serif; }
    .container {
      max-width:800px; margin-top:50px; background:#1e1e1e;
      border-radius:12px; padding:30px; box-shadow:0px 4px 15px rgba(0,0,0,0.5);
    }
    h1 { text-align:center; margin-bottom:20px; }
    .form-control { background:#2c2c2c; border:none; color:#fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 AI Interview</h1>
    <form method="POST" action="/evaluate">
      {% for q in questions %}
        <div class="mb-3">
          <label class="form-label">{{ q }}</label>
          <textarea class="form-control" name="answer{{ loop.index }}" rows="2"></textarea>
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-success w-100">Submit Answers</button>
    </form>
  </div>
</body>
</html>
